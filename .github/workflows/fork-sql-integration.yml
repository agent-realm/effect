# Fork-only: runs the cluster SQL storage integration suites on GitHub's
# ubuntu-latest runners, which have Docker. Upstream runs them on namespace
# runners this fork does not have. Lives only on the claude/fork-ci branch,
# never on a branch meant for upstream.
name: Fork SQL integration
on:
  workflow_dispatch:
  push:
    branches: [claude/fork-ci]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cluster-storage:
    name: Cluster storage (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EFFECT_INTEGRATION_TESTS: "1"
      # The ephemeral runner provides cleanup without a Ryuk sidecar.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        suite: [SqlRunnerStorage, SqlMessageStorage]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pre-pull test container images
        run: |
          docker pull postgres:alpine &
          docker pull mysql:lts &
          docker pull vitess/vttestserver:mysql80 &
          docker pull clickhouse/clickhouse-server:26.8 &
          wait

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Test
        # The verbose reporter names every test, so the log shows each backend ran.
        run: pnpm vitest run --project @effect/platform-node --reporter=verbose test/cluster/${{ matrix.suite }}.integration.test.ts
